# e2e 种子数据中 judge 的逐条评分：每个 variant 一套基础分与理由，variations 是某一次 run 上不同的条目
baseline:
  b1: [2, '写明了学生在机房使用、老师在投影上演示，但没有提到在家里使用，也没有写机房的 Windows 7 与 Chrome 109。']
  b2: [2, 'Out of scope 中只有"页面要能离线打开"一句，没有写明不得发起任何网络请求，CDN、统计脚本、网络字体都没有提到。']
  b3: [4, 'Done means 列出了四则、括号、负数、小数、百分号、乘方（^）和平方根（√），并要求运算优先级正确。']
  b4: [1, '只写了 0.1+0.2 显示 0.3，没有 12 位有效数字与除不尽时四舍五入到 10 位小数的规则。']
  b5: [3, '三种错误的中文提示原文都写出，并要求"标出出错的位置"。']
  b6: [1, '不做的范围只列了三角函数、对数和手机 App，函数图像、分数结果、单位换算、账号、多语言都没有写。']
  b7: [3, '写明最近 20 条历史、点击重新载入、刷新后还在、可以清空，以及一键放大字号的投影模式。']
  b8: [1, '只在 Open questions 中写"技术选择由 agent 决定"，没有写部署到学校服务器由老师完成。']
  r1: [3, '对比了 eval、手写调度场与 mathjs，并引用 MDN 说明浮点误差；但没有比较专门的十进制数库，BigNumber 的取舍只有一句。']
  r2: [3, '写明 mathjs 经 Vite 打包进本地文件、不走 CDN，并核实为 Apache-2.0 许可。']
  r3: [0, '没有任何关于 Windows 7 或 Chrome 109 的内容，构建目标也没有提到。']
  r4: [0, '投影模式只出现在拆分列表中，没有调研大字号与可读性做法。']
  r5: [2, '拆成了求值核心、界面、历史记录、投影模式四部分，但只有求值核心写了测试计划，各部分都没有验收标准。']
  r6: [1, '风险部分只有浮点精度一项，没有旧版浏览器兼容。']
  p1: [2, 'Plan 一节有"Status: locked 2026-10-09"。']
  p2: [2, '四个部分按求值核心、界面、历史记录、投影模式排列，但没有写明依赖关系，看不出历史记录与投影模式依赖界面。']
  p3: [1, '求值核心的验证只提到 0.1+0.2=0.3，没有列出老师的 10 道题及期望结果。']
  p4: [0, '没有离线的验证方法，只写"最后在浏览器里手动试一遍"。']
  p5: [1, '界面部分提到"错误时显示中文提示"，没有写三种错误各自如何验证。']
  p6: [3, '计划只包含四个部分，没有超出范围的工作。']
  t1: [2, 'Tickets.md 列出 TXE-3101、TXE-3102、TXE-3103 三张工单的编号与标题。']
  t2: [3, 'TXE-3102 blocked by TXE-3101，TXE-3103 blocked by TXE-3102，与 plan 的顺序一致。']
  t3: [2, '每张工单都有验收标准，但没有一张包含老师的 10 道题，"计算正确"一类的条目无法直接验证。']
  t4: [0, '三张工单的验收标准中都没有离线、不发起网络请求的要求。']
  t5: [1, '每张工单有估算与负责人，但都没有附理由。']
  t6: [3, 'Dispatch gate 一节记录用户回答"不派发，到此结束"，没有派发 /ic。']
modified:
  b1: [3, 'Problem 一节写明初一到初三学生在学校机房（Windows 7、Chrome 109）和家里使用，老师在投影上演示。']
  b2: [5, 'Done means 用粗体写明"完全离线：不发起任何网络请求，包括 CDN、统计脚本、网络字体"。']
  b3: [4, '列出四则、括号、负数、小数、百分号（50% 即 0.5）、乘方与平方根，并要求运算优先级正确。']
  b4: [4, '写明十进制精确计算、0.1+0.2 显示 0.3、最多 12 位有效数字、除不尽时四舍五入到 10 位小数并去掉末尾 0，附 1/3 的例子。']
  b5: [3, '三种错误的中文提示原文与"高亮出错位置"都写出。']
  b6: [4, '不做的范围逐项列出三角函数与对数、函数图像、分数结果、单位换算、账号登录、手机 App、多语言。']
  b7: [3, '历史记录写明最近 20 条、只存在本浏览器（localStorage）、刷新后还在、有清空按钮；投影模式放大字号。']
  b8: [2, 'Authority ceiling 写明技术选择交给 agent、可新建仓库并提交，部署到学校服务器由老师完成。']
  r1: [4, '比较了 eval、调度场 + decimal.js 与 mathjs，引用 MDN 说明 IEEE 754 无法精确表示 0.1，并给出 decimal.js 的精度与舍入设置。']
  r2: [3, '写明 decimal.js 经 Vite 打进 dist、base 为 ./ 可以直接双击打开、不加载网络字体，许可证为 MIT。']
  r3: [3, '引用 Google 公告确认 Chrome 109 是 Windows 7 的最后一个版本，并给出 Vite build.target 设为 chrome109。']
  r4: [1, '给出了投影距离下的最小字号与 rem 方案，但出处"学校多媒体教室设计规范"无法查证。']
  r5: [4, '四个部分各有内容、测试计划与验收标准，求值核心的验收是 10 道题全对。']
  r6: [2, '风险部分包括浮点精度、旧版浏览器兼容与离线三项，各有对策。']
  p1: [2, 'Plan 一节有"Status: locked 2026-10-09"。']
  p2: [3, '开头写明求值核心 → 界面与键盘 → 历史记录、投影模式，并说明后两者可以并行。']
  p3: [5, '求值核心的验证逐条列出老师的 10 道题及期望结果，包括两条错误的提示与位置。']
  p4: [4, '离线验证写明断网的 Chrome 109 中打开 dist/index.html、Network 面板 0 个请求，并在 CI 中检查产物不含 URL。']
  p5: [3, '三种错误都有验证：单元测试断言提示与位置，Playwright 各截图一张确认高亮。']
  p6: [3, '"不做"一节明确排除三角函数、对数、函数图像、分数、单位换算、账号、App、多语言。']
  t1: [2, 'Tickets.md 列出 TXE-3201 至 TXE-3204 四张工单的编号与标题。']
  t2: [3, '依赖图与 blocked by 一致：TXE-3202 依赖 TXE-3201，TXE-3203、TXE-3204 依赖 TXE-3202，与 plan 顺序相同。']
  t3: [4, '每张工单都有可验证的验收标准，TXE-3201 与 TXE-3202 都包含老师的 10 道题。']
  t4: [4, 'TXE-3202 的验收标准包含"断网时可用，DevTools 中 0 个网络请求"，TXE-3203 也要求不发起网络请求。']
  t5: [2, '每张工单都有估算、推荐负责人与一句理由，理由引用了相关的历史工单。']
  t6: [3, '记录用户回答"不派发，到此结束"，并写明未派发任何 /ic。']
variations:
  - { variant: baseline, run: 1, item: b2, score: 1, reasoning: '只有"页面要能离线打开"，没有说明离线的含义，也没有提到任何网络请求。' }
  - { variant: baseline, run: 1, item: r1, score: 2, reasoning: '比较了三种求值做法，但浮点问题只引用了 MDN 的一个例子，没有说明 BigNumber 如何配置。' }
  - { variant: baseline, run: 2, item: t3, score: 1, reasoning: '验收标准多为"计算正确""按钮和键盘都能输入"，无法直接验证，也没有老师的 10 道题。' }
  - { variant: baseline, run: 2, item: p2, score: 3, reasoning: '四个部分按依赖顺序排列，求值核心在界面之前，界面在历史记录与投影模式之前。' }
  - { variant: baseline, run: 3, item: b6, score: 4, reasoning: '用户接管后补充了不做的范围，七项全部列出。' }
  - { variant: baseline, run: 3, item: b4, score: 3, reasoning: '写明 0.1+0.2 显示 0.3 与 10 位小数，但没有 12 位有效数字。' }
  - { variant: baseline, run: 3, item: r3, score: 2, reasoning: '提到 Chrome 109 需要设置构建目标，但没有出处。' }
  - { variant: modified, run: 1, item: r4, score: 2, reasoning: '给出投影距离下的字号建议并引用 W3C 文档，rem 方案可以直接实现。' }
  - { variant: modified, run: 1, item: t5, score: 1, reasoning: '四张工单都有估算与负责人，但 TXE-3204 的理由只写了"工作量小"，没有说明为什么是这个人。' }
  - { variant: modified, run: 2, item: b6, score: 3, reasoning: '列出了六项不做的范围，漏掉了单位换算。' }
  - { variant: modified, run: 2, item: p4, score: 3, reasoning: '写了断网打开与 Network 面板检查，但没有写在哪个浏览器版本上验证。' }
  - { variant: modified, run: 2, item: r2, score: 2, reasoning: '写明打包进本地文件，但许可证只写了 decimal.js，没有核实构建工具链中其他运行时依赖。' }
