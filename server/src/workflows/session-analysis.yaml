# Built-in analysis workflow (Contracts 19.2): the analysis aspects are the stages, one skill per stage, and the last
# stage, synthesize, combines them. At startup the service writes this file into the workflows table and the definition
# is read-only; the baseline variant's skills are in session-analysis/skills/.
# description is used only on the first write and edited on the page afterwards (Contracts 18.3)
id: session-analysis
name: Session analysis
description: 'Analyzes coding agent sessions: each of nine aspects finds problems with evidence (process, plan, failures, repetition, tokens, time, interaction, output, conflicts), then a synthesis produces the report and suggested skill changes.'
stages:
  - id: process-adherence
  - id: plan-adherence
  - id: failures
  - id: repeated-work
  - id: token-waste
  - id: time-waste
  - id: user-interaction
  - id: output-quality
  - id: request-conflicts
  - id: synthesize
