# 内置的 dev-workflow（Contracts 16.1）：Magi workflow 的 /lfg 与 /ic。服务启动时以本文件为准写入 workflows 表，页面中不能修改
id: dev-workflow
name: dev-workflow
bigStages:
  - id: lfg
    title: 想法到工单
    prepare: [empty-repo, vault-dir]
    message: "/lfg {input}\n\nProduct: Magi Eval\nFeature slug: {runId}\nRepository: {repo}"
    done: 你在之前的对话中已经回答过 dispatch gate（不派发），并且 agent 最新一轮报告了结束状态；或 agent 明确报告无法继续。
    dispatchGate: true
    stages:
      - id: interview
      - id: research
      - id: plan
      - id: ticketing
    grading:
      - rubric:
          artifacts:
            - id: brief
              files: [{ file: Brief.md, kind: brief }]
              description: Brief.md：interview 阶段写出的需求简报
            - id: research
              files:
                [{ file: Research.md, kind: research }, { file: System Design.md, kind: design }]
              description: Research.md：基于 brief 的调研与 spec
            - id: plan
              files:
                [{ file: Research.md, kind: research }, { file: System Design.md, kind: design }]
              description: 锁定后的 plan（Research.md 的 Plan 一节或 System Design.md）
              lockedPlan: true
            - id: tickets
              files: [{ file: Tickets.md, kind: tickets }]
              description: Tickets.md 与该 run 在 Linear 中建出的工单
              linearTickets: true
  - id: ic
    title: 工单到 PR
    prepare: [repo-copy, ticket-copy]
    message: '/ic {ticket}'
    done: agent 最新一轮报告 PR 已经标记为 ready for review（工单已移到 review 状态）；或 agent 明确报告无法继续。
    stages:
      - id: claim
      - id: readiness
      - id: implement
      - id: acceptance
      - id: open-pr
      - id: fix-pr
        repeatable: true
        allowInside: [acceptance]
      - id: ready-for-review
    grading: [hidden-tests, criteria-judge, pr-endpoint]
