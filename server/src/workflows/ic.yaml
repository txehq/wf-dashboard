# 内置的 ic workflow（Contracts 16.1）：Magi workflow 的 /ic。服务启动时以本文件为准写入 workflows 表，页面中只读；
# description 只在第一次写入时使用，之后在页面中编辑（Contracts 18.3）
id: ic
name: ic
description: 从一张已分配的工单到可以评审的 PR：认领，检查本机，实现，验收，开 PR，修到评审与 CI 都通过。
stages:
  - id: claim
  - id: readiness
  - id: implement
  - id: acceptance
  - id: open-pr
  - id: fix-pr
    repeatable: true
    allowInside: [acceptance]
  - id: ready-for-review
