# Built-in ic workflow (Contracts 16.1): /ic of the Magi workflow. At startup the service writes this file into the
# workflows table; read-only on the page. description is used only on the first write and edited on the page afterwards
# (Contracts 18.3)
id: ic
name: ic
description: 'From an assigned ticket to a PR ready for review: claim, check this machine, implement, acceptance, open the PR, fix until review and CI pass.'
stages:
  - id: claim
  - id: readiness
  - id: implement
  - id: acceptance
  - id: open-pr
  - id: fix-pr
    repeatable: true
    allowInside: [acceptance]
  - id: ready-for-review
