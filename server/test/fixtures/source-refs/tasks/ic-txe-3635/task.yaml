ticket:
  title: "[CC3-sfdcda9] Validator Site browser drops the release label because it contains '@'"
  body: |-
    Deliverable consumer: team-infra → workstream: devops

    Found while capturing the staging baseline for <issue id="577c1714-7b6a-4843-82fc-87719f80f8f2" href="https://linear.app/capso/issue/TXE-3631/cc3-sfdcda9-validator-site-reviewed-staging-only-promotion-of-011">TXE-3631</issue>: `/api/v1/web-config` on [validator-mcga.engapp.dev](<http://validator-mcga.engapp.dev>) reports `release: validator-site-web@0.1.1-capso.184`. The browser sender added in <issue id="4e84b689-6c03-432a-9072-65b668d64500" href="https://linear.app/capso/issue/TXE-3570/cc3-sfdcda9-validator-site-fakellms-harden-openpanel-senders-for-the">TXE-3570</issue> accepts environment/release only when they match `^[A-Za-z0-9._-]{1,64}$`, so every browser event from the real web config omits `release`, contrary to "release/environment unambiguous". The <issue id="4e84b689-6c03-432a-9072-65b668d64500" href="https://linear.app/capso/issue/TXE-3570/cc3-sfdcda9-validator-site-fakellms-harden-openpanel-senders-for-the">TXE-3570</issue> test used a release value without '@', which is why it passed.

    Fix: accept the real release shape (allow '@' and '+'), and test with the exact value the deployed web-config serves. One PR in txehq/tokun-cn validator-site/frontend. Production promotion (<issue id="37f5cb9e-ae6b-409f-901e-3f1ae2e8ce91" href="https://linear.app/capso/issue/TXE-3632/cc3-sfdcda9-validator-site-reviewed-production-promotion-of-the">TXE-3632</issue>) should carry the fixed release.
  acceptanceCriteria:
    - "`validator-site/frontend/src/analytics.ts` 接受部署的 web-config 实际给出的 release 值 `validator-site-web@0.1.1-capso.184`：release 中允许 `@` 与 `+`，长度上限不变"
    - "`validator-site/frontend/test/analytics.test.ts` 用这个真实的 release 值测试修复，并保留对非法值的拒绝；`npm test` 通过"
