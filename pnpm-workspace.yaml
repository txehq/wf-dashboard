packages:
  - server
  - web
  - desktop
allowBuilds:
  # Downloads the Electron binary the release packages into WF Dashboard.app
  electron: true
  esbuild: true
  # The install script only checks the bundled darwin prebuild and arranges build/; nothing is compiled locally
  node-pty: true
  # Only the bundled tree-sitter-bash.wasm is used (loaded by web-tree-sitter); the native node binding is not compiled
  tree-sitter-bash: false
minimumReleaseAgeExclude:
  - '@fastify/sse@0.6.1'
  - concurrently@10.0.6
  - drizzle-orm@0.45.4
  - lucide-react@1.54.0
  - vite@8.3.4
