id: ic-task-store-list
kind: ic
title: Add a list with filtering, sorting and pagination to TaskStore
persona: |-
  Zhou Hang, tech lead of Acme's planning service, has written TypeScript for many years; @acme/task-store is his team's library.
  Cares about: the frontend task list page is about to launch and needs a stable, paginated query API; when paging, the same task must never appear on two pages or go missing.
  How he talks: in English, well organised, gives the conclusion first and then the reasons; cares a lot about type definitions and likes to state defaults and limits as concrete numbers.
hiddenRequirements: |-
  - Add TaskStore.list(options?) returning { items, total, page, pageSize, totalPages }; items are full copies of the Task objects, and modifying them does not affect the store.
  - Filtering: status (open or done); search is a case-insensitive substring match on the title after trimming surrounding whitespace, and a blank search means no filter; when both are given, the intersection is returned.
  - Sorting: sort is one of createdAt, priority, title, default createdAt; order is asc or desc, default asc; sorting by title is case-insensitive (localeCompare, en, sensitivity base).
  - Tasks with equal sort values are always ordered by id ascending, also with desc, so paging is stable.
  - Pagination: page starts at 1, default 1; pageSize defaults to 20 with a maximum of 100; total is the count after filtering; totalPages = ceil(total / pageSize), 0 when there are no results; when page is past the last page items is empty and the other fields are returned as usual.
  - A RangeError is thrown when page or pageSize is not an integer or is below 1, or when pageSize is above 100.
  - Filter first, then sort, then paginate; list does not change the store's internal order.
  - Export the ListOptions and ListResult types and the DEFAULT_PAGE_SIZE and MAX_PAGE_SIZE constants; no new runtime dependencies; npm run typecheck and npm test must both pass; add unit tests.
ticket:
  title: TaskStore list query with filtering by status and keyword, sorting and pagination
  body: |-
    The task list page needs to read tasks from `TaskStore` page by page. Today there is only `get` by id, so the frontend has to iterate over everything itself.

    Please add `list(options?)` to `src/store.ts` that filters by status and title keyword, sorts by creation time / priority / title, paginates, and returns the total count and the total number of pages. For the same query the order of tasks across pages must be stable.
  acceptanceCriteria:
    - "`store.list()` without arguments returns all tasks in ascending `createdAt` order with `page` 1 and `pageSize` 20, and returns `total` and `totalPages`."
    - "`status` filters by status; `search` does a case-insensitive substring match on the title; both can be used together."
    - "`sort` supports `createdAt`, `priority` and `title`, `order` supports `asc` and `desc`; equal sort values are ordered by ascending `id`, so paging is stable."
    - "`page` starts at 1; past the last page `items` is empty; the maximum `pageSize` is 100; an invalid `page` or `pageSize` throws a `RangeError`."
    - The returned tasks are copies and modifying them does not affect the store; `npm run typecheck` and `npm test` pass, and new unit tests cover the behaviour above.
repo:
  path: repo.bundle
  commit: af8d995554edc1ff7a4c23dbf1cc9037aef0ea58
requiredChecks:
  - ci
hiddenTests:
  dir: hidden-tests
  config: vitest.hidden.config.mjs
  command: npx vitest run test/hidden --config {configPath} --reporter=junit --outputFile.junit={junitPath}
  timeoutSeconds: 600
  manifest:
    test/hidden/list.hidden.test.ts:
      - defaults > no options lists everything by creation time, ascending
      - defaults > empty store
      - defaults > items are full task objects
      - filtering > by status
      - filtering > search is a case-insensitive substring match
      - filtering > search ignores surrounding whitespace; blank search matches all
      - filtering > status and search combine
      - filtering > total counts all matches, not just the page
      - sorting > priority ascending breaks ties by id
      - sorting > priority descending still breaks ties by ascending id
      - sorting > title sorting ignores case
      - sorting > createdAt descending
      - sorting > equal createdAt falls back to id
      - pagination > pages are 1-based slices
      - pagination > a page past the end is empty but keeps the totals
      - pagination > pageSize up to 100 is accepted
      - pagination > pagination applies after filtering and sorting
      - validation > page 0 is rejected
      - validation > page -1 is rejected
      - validation > page 1.5 is rejected
      - validation > page NaN is rejected
      - validation > pageSize 0 is rejected
      - validation > pageSize 101 is rejected
      - validation > pageSize 2.5 is rejected
      - validation > pageSize Infinity is rejected
      - isolation > mutating returned items does not change the store
      - isolation > listing does not change insertion order for later calls
