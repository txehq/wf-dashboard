        maxScore: 5
      - id: p4
        criterion: Does the plan state how offline use is verified (for example opening the page with the network disconnected and confirming there are no network requests)?
        maxScore: 4
      - id: p5
        criterion: Does the plan state how the three error messages (dividing by 0, unmatched parentheses, square root of a negative number) are verified?
        maxScore: 3
      - id: p6
        criterion: Is the plan free of out-of-scope work (trigonometry, function plots, accounts, app, multiple languages and so on)?
        maxScore: 3
  - artifact: tickets
