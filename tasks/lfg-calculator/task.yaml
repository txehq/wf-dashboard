id: lfg-calculator
kind: lfg
title: A web calculator for the classroom
persona: |
  Chen Hui, a maths teacher at the city's No. 2 Middle School who also runs the school's computer lab and IT classes; she teaches grades 7 to 9.
  Cares about: results students get in class must be exact (she has seen 0.1+0.2 give 0.30000000000000004 and confuse students); the computer lab often loses its internet connection, and if the page will not open the lesson cannot go ahead; error messages must make sense to 12- and 13-year-olds.
  How she talks: knows no technical terms, describes things in everyday words and likes concrete classroom examples; asked about technical choices she says "you decide, I don't understand that"; asked about scope she thinks it through and answers clearly.
hiddenRequirements: |
  Users and setting
  - Students in grades 7 to 9 use it in the school computer lab (Windows 7 PCs with the school-installed Chrome 109) and at home; the teacher demonstrates it on a projector.
  - It is needed in class at the start of next term (two months from now).
  Form
  - A web page: it works by double-clicking a local HTML file or opening a static site on the school intranet.
  - It must work fully offline: no network requests at all, including CDNs, analytics scripts and web fonts.
  Features
  - The four basic operations, parentheses, negative numbers, decimals, percent (50% is 0.5), powers (with ^) and square root (√), with correct operator precedence.
  - The whole expression is typed in and visible in full; Enter or "=" gives the result; both on-screen buttons and keyboard input are supported.
  - Precision: exact decimal arithmetic, 0.1+0.2 shows 0.3; results show at most 12 significant digits; non-terminating divisions are rounded to 10 decimal places with trailing zeros removed (1/3 shows 0.3333333333).
  - Error messages are in English and highlight where the error is: dividing by 0 shows "Cannot divide by 0", unmatched parentheses show "Unmatched parentheses", the square root of a negative number shows "Cannot take the square root of a negative number".
  - History: shows the last 20 expressions and results, clicking one reloads its expression; stored only in this browser (localStorage), still there after a refresh; has a "Clear history" button.
  - Projector mode: a button enlarges the font so students in the back rows can read it.
  Out of scope
  - Scientific functions such as trigonometry and logarithms; plotting functions; results as fractions; unit conversion; account login; a mobile app; multiple languages (English UI only).
  Constraints
  - No student data is collected.
  Acceptance
  - All 10 of the teacher's questions are correct: 0.1+0.2=0.3, (2+3)*4=20, 2^10=1024, √16=4, 50%*200=100, 1/3=0.3333333333, -5+3=-2, (1+2)*(3+4)/7=3, 5/0 shows "Cannot divide by 0", (1+2 shows "Unmatched parentheses".
  Authority
  - All technical choices are left to the agent; the agent may create a new repository and commit code; deploying to the school server is done by the teacher, and it does not need to go live on the public internet.
input: build a calculator
rubric:
  - artifact: brief
    items:
      - id: b1
        criterion: Does the brief state that the users are middle school students, that it is used in the school computer lab and at home, and that the teacher demonstrates it on a projector?
        maxScore: 3
      - id: b2
        criterion: Does the brief state that it must work fully offline and make no network requests (including CDNs, analytics and web fonts)?
        maxScore: 5
      - id: b3
        criterion: Does the brief list the operations to support (the four basic operations, parentheses, negative numbers, decimals, percent, powers, square root) and require correct operator precedence?
        maxScore: 4
      - id: b4
        criterion: Does the brief state the decimal precision requirement (0.1+0.2 shows 0.3) and the rules for significant digits and rounding of non-terminating divisions?
        maxScore: 4
      - id: b5
        criterion: Does the brief state the English messages for the three errors (dividing by 0, unmatched parentheses, square root of a negative number) and the highlighting of the error position?
        maxScore: 3
      - id: b6
        criterion: Does the brief list each out-of-scope item (trigonometry and logarithms, function plots, fraction results, unit conversion, accounts, mobile app, multiple languages)?
        maxScore: 4
      - id: b7
        criterion: Does the brief state the history (last 20 entries, stored only in this browser, can be cleared) and the enlarged projector font?
        maxScore: 3
      - id: b8
        criterion: Does the brief state the limits of authority (the agent picks the technology and commits to a new repository, the teacher deploys to the school server)?
        maxScore: 2
  - artifact: research
    items:
      - id: r1
        criterion: Does the research compare approaches to expression evaluation and decimal arithmetic (for example an established expression parser or decimal number library), explain why plain floating point cannot be used, and cite sources?
        maxScore: 4
      - id: r2
        criterion: Does the research confirm that the chosen libraries can be bundled into local files for offline use without a CDN, and check their licences?
        maxScore: 3
      - id: r3
        criterion: Does the research verify that the chosen technology runs on Chrome 109 on Windows 7 (for example the build target settings), with sources?
        maxScore: 3
      - id: r4
        criterion: Does the research look into large fonts and readability for projector use?
        maxScore: 2
      - id: r5
        criterion: Does the research split the requirement into independently implementable parts (evaluation core, UI and keyboard input, history, projector mode), each with a test plan and acceptance criteria?
        maxScore: 4
      - id: r6
        criterion: Does the risks section of the research include at least floating point precision and old browser compatibility?
        maxScore: 2
  - artifact: plan
    items:
      - id: p1
