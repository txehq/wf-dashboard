id: lfg-todo-api
kind: lfg
title: A to-do list HTTP API for a mobile app
persona: |
  Wang Lei, an iOS engineer at a 20-person startup. The company app is getting a to-do feature, the backend colleague has left, and he is in charge of the backend for now.
  Cares about: a stable API that supports the app's offline editing; he has to maintain it himself after launch, so he wants TypeScript, which he knows; he does not want to be woken up because the backend broke.
  How he talks: technically fluent, answers directly and briefly, often gives concrete app-side scenarios (no network on the subway, tapping submit twice); when unsure he asks back "what do you suggest?", and after hearing the reasons he makes a clear decision.
hiddenRequirements: |
  Callers and scale
  - Only the company's own iOS app calls it, over HTTPS; about 50,000 monthly active users, peaking at about 200 requests per second; there is no web client.
  - The new app version goes to review in 6 weeks, and the API must be live and stable on staging before then.
  Technology and deployment
  - TypeScript + Node 22; the database is the company's existing PostgreSQL (AWS RDS); deployed as a Docker image to the company's existing AWS ECS.
  Authentication
  - Reuses the company's existing JWT: RS256 signatures, public keys fetched from the company's JWKS URL; the API does not handle sign-up or login.
  - Each user can read and write only their own lists and to-dos; accessing someone else's resources returns 404.
  Data
  - To-do: title (required, at most 200 characters), notes (at most 2000 characters), due time (optional), priority (low, medium, high), completion status, owning list.
  - List: name, colour, sort position.
  - When a user deletes their account, all their data is deleted once the company's existing user.deleted event arrives (via SQS).
  API
  - REST + JSON under the path prefix /v1; OpenAPI documentation is generated automatically.
  - The to-do list endpoint filters by list, completion status and due time range, sorts by due time or creation time, and uses cursor pagination with at most 100 items per page.
  - Errors are always { "error": { "code", "message" } }; validation errors return 422 and list the invalid fields.
  Offline sync
  - The app edits offline and syncs when back online: GET /v1/changes?since=<cursor> returns the lists and to-dos created, changed or deleted since then, and a new cursor.
  - Deletes are soft deletes and tombstones are kept for 30 days; a cursor older than 30 days returns 410 and the app does a full sync.
  - Conflicts are resolved last writer wins, based on the updatedAt submitted by the client.
  Reliability
  - Create endpoints accept an Idempotency-Key header: repeating a request with the same key within 24 hours returns the first result (the app retries on weak networks).
  - p95 latency below 200ms; a rate limit of 60 requests per user per minute, exceeding it returns 429 with Retry-After.
  Out of scope
  - A web client; push notifications (the app does local reminders itself); shared or collaborative lists; attachments; full-text search; tags and subtasks; an admin console; sign-up and login; data export.
  Authority
  - The agent may create a repository, write code and open PRs; it must not touch the production database or the AWS production environment; it must ask him before deploying to staging.
input: build an HTTP API for a to-do list
