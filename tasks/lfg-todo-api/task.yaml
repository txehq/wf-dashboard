      - id: b2
        criterion: Does the brief state that authentication reuses the company's existing JWT (RS256, JWKS public keys), that the API does no sign-up or login, and that users can only access their own data?
        maxScore: 5
      - id: b3
        criterion: Does the brief state the to-do and list fields with their length limits, and explicitly exclude tags, subtasks, attachments and shared lists?
        maxScore: 4
      - id: b4
        criterion: Does the brief state the offline incremental sync (changes endpoint, soft-delete tombstones kept for 30 days, handling of expired cursors, last writer wins)?
        maxScore: 5
      - id: b5
        criterion: Does the brief state the idempotency requirement for create endpoints (Idempotency-Key, returning the first result within 24 hours)?
        maxScore: 3
      - id: b6
        criterion: Does the brief state the non-functional requirements (p95 below 200ms, a rate limit of 60 per user per minute with 429)?
        maxScore: 3
      - id: b7
        criterion: Does the brief state the technology and deployment constraints (TypeScript + Node 22, the existing PostgreSQL, Docker deployment to the existing ECS)?
        maxScore: 3
      - id: b8
        criterion: Does the brief state the limits of authority (may create repositories and open PRs, must not touch production, must ask before deploying to staging)?
        maxScore: 3
