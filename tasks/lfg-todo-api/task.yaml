        maxScore: 5
      - id: r3
        criterion: Does the research look into implementing Idempotency-Key (where it is stored, expiry, concurrent requests with the same key) with sources?
        maxScore: 4
      - id: r4
        criterion: Does the research look into libraries for RS256 JWT verification and for fetching and caching JWKS public keys?
        maxScore: 3
      - id: r5
        criterion: Does the research look into how to implement cursor pagination and per-user rate limiting?
        maxScore: 3
      - id: r6
        criterion: Is the spec in the research split into parts, each with a test plan and acceptance criteria?
