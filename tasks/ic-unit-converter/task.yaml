id: ic-unit-converter
workflow: dev-workflow
bigStage: ic
title: 单位换算页面：温度、结果精度、输入提示与交换单位
persona: |-
  周婷，Acme 跨境电商商品团队的运营，每天用这个内部的单位换算页面把供应商给的英制规格换成商品详情页上的公制数值。
  关心：页面上出现 2.5399999999999996 cm 这样的结果，被她直接复制进了商品详情页，客户投诉看不懂；下个月开始上架冷链生鲜，需要在华氏度、摄氏度之间换算储存温度；输错数字时页面显示 NaN，她不知道哪里错了。
  说话方式：中文，不懂代码，描述的都是自己在页面上看到和点到的东西，喜欢举具体的数字（"我输入 3 英尺，应该看到 0.9144 米"）；技术细节会说"你们按工单来就行"。
hiddenRequirements: |-
  温度：
  - 类别下拉框新增"温度"（排在长度、重量之后），单位依次为"摄氏度 (°C)"、"华氏度 (°F)"、"开尔文 (K)"，单位 id 为 c、f、k，结果中的符号为 °C、°F、K。
  - 切换到温度时，"从"默认摄氏度，"换算为"默认华氏度（与其他类别一样取前两个单位）。
  - 换算是线性加偏移：°F = °C × 9/5 + 32，K = °C + 273.15；convert(value, from, to) 支持任意两种温度单位之间换算，同一单位原样返回。
  - 温度可以是负数，但不能低于绝对零度（-273.15 °C、-459.67 °F、0 K）；正好等于绝对零度是允许的。
  - 温度与长度、重量之间换算仍然抛错。
  结果显示：
  - 结果最多保留 4 位小数，去掉末尾的 0，没有千分位：1 英寸 → 2.54 cm，3 英尺 → 0.9144 m，1 盎司 → 28.3495 g，1 英里 → 1609.344 m，37 °C → 98.6 °F，1 °F → -17.2222 °C。
  - 四舍五入后为 0 的结果显示 0，不显示 -0。
  - 这条规则实现在 src/format.ts 的 formatNumber(value) 中，结果区域显示"数值 + 空格 + 单位符号"。
  输入提示：
  - 数值为空（包括只有空格）时，结果区域显示"—"，不显示任何错误提示。
  - 前后的空格忽略（"  12  " 按 12 处理）。
  - 不是完整数字时（例如 abc、12abc、1.2.3、单独一个 -），在数值输入框下方显示"请输入数字"，结果显示"—"。现在 12abc 会被当成 12 换算，这是错的。
  - 长度、重量为负数时显示"长度和重量不能为负数"；温度低于绝对零度时显示"温度不能低于绝对零度"；判断以"从"所选的单位为准，改了"从"的单位要重新判断。
  - 出错时数值输入框带 aria-invalid="true"，改正后去掉；提示随输入实时更新，不需要提交。
  交换单位：
  - "从"与"换算为"之间有一个按钮，可访问名称为"交换单位"（可以是图标按钮加 aria-label）；点击后两个单位互换，数值不变，结果立即按新方向更新；点击不能提交表单或刷新页面。
  其他：
  - 页面上现有控件的标签（类别、数值、从、换算为、结果）与现有单位的名称保持不变，团队的操作手册截图里用的就是这些。
  - 不新增运行时依赖；为新行为补充单元测试与 e2e 测试，npm test 与 npm run e2e 通过。
ticket:
  title: 单位换算页面：新增温度换算，修复结果精度与无效输入显示，增加交换单位按钮
  body: |-
    商品团队用这个页面换算供应商规格，目前有几个问题：

    1. 结果带着浮点误差：1 英寸换算成厘米显示 `2.5399999999999996 cm`，3 英尺换算成米显示 `0.9144000000000001 m`。这些数字被直接复制到了商品详情页上。
    2. 输入错了没有提示：数值为空或输入 `abc` 时结果显示 `NaN cm`；输入 `12abc` 时页面当成 12 换算；输入负的长度也照样换算。
    3. 下个月开始上架冷链商品，需要在页面上换算储存温度（摄氏度、华氏度、开尔文）。
    4. 经常要反过来换算，每次都要重新选两个下拉框。

    换算逻辑在 `src/convert.ts`（`convert(value, from, to)`），结果的数字格式在 `src/format.ts`（`formatNumber(value)`），单位定义在 `src/units.ts`。温度单位的 id 用 `c`、`f`、`k`。页面上现有控件的标签（类别、数值、从、换算为、结果）保持不变。
  acceptanceCriteria:
    - 在页面上把 1 英寸换算成厘米显示 `2.54 cm`，3 英尺换算成米显示 `0.9144 m`；结果最多 4 位小数，不带末尾的 0，不显示 `-0`。
    - 类别中可以选"温度"，单位为"摄氏度 (°C)"、"华氏度 (°F)"、"开尔文 (K)"；页面上 100 °C 显示 `212 °F`，0 K 显示 `-273.15 °C`。
    - 数值为空时结果显示 `—` 且没有错误提示；输入 `abc` 或 `12abc` 时输入框下方显示"请输入数字"，结果显示 `—`。
    - 长度、重量为负数时显示"长度和重量不能为负数"；温度低于绝对零度时显示"温度不能低于绝对零度"；改正后提示消失并显示结果。
    - 页面上有"交换单位"按钮，点击后"从"与"换算为"互换，结果立即更新，例如 1 米 → 厘米交换后显示 `0.01 m`。
    - 新增的单元测试与 e2e 测试覆盖以上行为，`npm test` 与 `npm run e2e` 通过。
repo:
