id: ic-unit-converter
kind: ic
title: "Unit converter page: temperature, result precision, input hints and unit swap"
persona: |-
  Zhou Ting, an operations specialist on the Acme cross-border e-commerce product team. Every day she uses this internal unit converter page to turn the imperial specs suppliers send into the metric values on product detail pages.
  Cares about: results like 2.5399999999999996 cm show up on the page, she copied them straight into product detail pages and customers complained they could not read them; next month the team starts listing cold-chain fresh food and needs to convert storage temperatures between Fahrenheit and Celsius; when she mistypes a number the page shows NaN and she cannot tell what went wrong.
  How she talks: plain English, does not know code, describes only what she sees and clicks on the page, likes concrete numbers ("I type 3 feet, I should see 0.9144 metres"); on technical details she says "just follow the ticket".
hiddenRequirements: |-
  Temperature:
  - The category dropdown gets a new "Temperature" option (after Length and Weight) whose units are, in order, "Celsius (°C)", "Fahrenheit (°F)", "Kelvin (K)", with unit ids c, f, k and result symbols °C, °F, K.
  - When switching to Temperature, "From" defaults to Celsius and "To" defaults to Fahrenheit (the first two units, as for the other categories).
  - Conversion is linear with an offset: °F = °C × 9/5 + 32, K = °C + 273.15; convert(value, from, to) converts between any two temperature units and returns the value unchanged for the same unit.
  - Temperatures may be negative but not below absolute zero (-273.15 °C, -459.67 °F, 0 K); exactly absolute zero is allowed.
  - Converting between temperature and length or weight still throws.
  Result display:
  - Results keep at most 4 decimals, drop trailing zeros and have no thousands separators: 1 inch → 2.54 cm, 3 feet → 0.9144 m, 1 ounce → 28.3495 g, 1 mile → 1609.344 m, 37 °C → 98.6 °F, 1 °F → -17.2222 °C.
  - A result that rounds to 0 shows 0, never -0.
  - This rule is implemented in formatNumber(value) in src/format.ts; the result area shows "number + space + unit symbol".
  Input hints:
  - When the value is empty (including only spaces), the result area shows "—" and no error hint.
  - Leading and trailing spaces are ignored ("  12  " is treated as 12).
  - When the value is not a complete number (for example abc, 12abc, 1.2.3, a lone -), "Enter a number" is shown below the value field and the result shows "—". Today 12abc is converted as 12, which is wrong.
  - Negative lengths and weights show "Length and weight cannot be negative"; temperatures below absolute zero show "Temperature cannot be below absolute zero"; the check uses the unit selected in "From", and changing the "From" unit re-runs the check.
  - On an error the value field has aria-invalid="true", removed once fixed; hints update live while typing, with no submit.
  Unit swap:
  - Between "From" and "To" there is a button with the accessible name "Swap units" (an icon button with an aria-label is fine); clicking it swaps the two units, keeps the value and immediately updates the result in the new direction; clicking must not submit the form or reload the page.
  Other:
  - The labels of the existing controls on the page (Category, Value, From, To, Result) and the names of the existing units stay unchanged; the team's operations manual screenshots use them.
  - No new runtime dependencies; add unit tests and e2e tests for the new behaviour; npm test and npm run e2e pass.
ticket:
  title: "Unit converter page: add temperature conversion, fix result precision and invalid input display, add a swap units button"
  body: |-
    The product team uses this page to convert supplier specs, and it currently has several problems:

    1. Results carry floating point noise: 1 inch to centimetres shows `2.5399999999999996 cm`, 3 feet to metres shows `0.9144000000000001 m`. These numbers were copied straight onto product detail pages.
    2. Wrong input gets no hint: an empty value or `abc` shows `NaN cm`; `12abc` is converted as 12; negative lengths are converted too.
    3. Next month we start listing cold-chain products and need to convert storage temperatures on the page (Celsius, Fahrenheit, Kelvin).
    4. We often need the reverse conversion and have to re-select both dropdowns every time.

    The conversion logic is in `src/convert.ts` (`convert(value, from, to)`), the result number format in `src/format.ts` (`formatNumber(value)`), and the unit definitions in `src/units.ts`. Use the ids `c`, `f`, `k` for the temperature units. The labels of the existing controls on the page (Category, Value, From, To, Result) stay unchanged.
  acceptanceCriteria:
    - On the page 1 inch to centimetres shows `2.54 cm` and 3 feet to metres shows `0.9144 m`; results have at most 4 decimals, no trailing zeros and never show `-0`.
    - The category can be set to "Temperature" with the units "Celsius (°C)", "Fahrenheit (°F)", "Kelvin (K)"; on the page 100 °C shows `212 °F` and 0 K shows `-273.15 °C`.
    - With an empty value the result shows `—` and no error hint; for `abc` or `12abc` the hint "Enter a number" appears below the field and the result shows `—`.
    - Negative lengths and weights show "Length and weight cannot be negative"; temperatures below absolute zero show "Temperature cannot be below absolute zero"; once fixed the hint disappears and the result is shown.
    - The page has a "Swap units" button that swaps "From" and "To" and updates the result immediately, for example 1 metre → centimetres shows `0.01 m` after the swap.
    - New unit tests and e2e tests cover the behaviour above, and `npm test` and `npm run e2e` pass.
repo:
  path: repo.bundle
  commit: 93a8b46fa4ac790288a31dab837cb9e69ab4ae75
requiredChecks:
  - ci
hiddenTests:
  dir: hidden-tests
  config: hidden-tests/playwright.config.mts
  command: PLAYWRIGHT_JUNIT_OUTPUT_FILE={junitPath} npx playwright test --config {configPath} --reporter=junit
  timeoutSeconds: 600
  manifest:
    test/hidden/convert.hidden.spec.ts:
      - convert temperature › °C to °F
      - convert temperature › °F to °C
      - convert temperature › °C to K and back
      - convert temperature › °F to K and K to °F
      - convert temperature › same temperature unit returns the value
      - convert temperature › round trip °C → °F → °C
      - convert keeps existing behaviour › length and weight ratios
      - convert keeps existing behaviour › temperature cannot be converted to length
      - formatNumber › floating point noise is removed
      - formatNumber › at most four decimals
      - formatNumber › no trailing zeros
      - formatNumber › values that round to zero print as 0, never -0
      - formatNumber › negative values keep their sign
    test/hidden/ui.hidden.spec.ts:
      - existing conversions › one metre is 100 cm on load
      - existing conversions › switching to weight lists weight units
      - existing conversions › surrounding spaces in the value are ignored
      - result precision › 1 in shows 2.54 cm
      - result precision › 3 ft shows 0.9144 m
      - result precision › 1 oz is rounded to four decimals
      - result precision › 1 mi keeps all three decimals
      - temperature › the category lists Celsius, Fahrenheit and Kelvin
      - temperature › 100 °C is 212 °F
      - temperature › 37 °C is 98.6 °F
      - temperature › -40 °C is -40 °F
      - temperature › 0 K is -273.15 °C
      - temperature › 1 °F is -17.2222 °C
      - temperature › 0 °C is 273.15 K
      - temperature › negative temperatures above absolute zero are allowed
      - temperature › -459.67 °F is exactly absolute zero and allowed
      - invalid input › empty value shows a dash without an error
      - invalid input › "abc" asks for a number
      - invalid input › "12abc" asks for a number
      - invalid input › "1.2.3" asks for a number
      - invalid input › "-" asks for a number
      - invalid input › fixing the value clears the error
      - invalid input › negative length is rejected
      - invalid input › negative weight is rejected
      - invalid input › -300 °C is below absolute zero
      - invalid input › -1 K is below absolute zero
      - invalid input › -460 °F is below absolute zero
      - invalid input › changing the source unit re-checks absolute zero
      - swap units › swapping metre and centimetre
      - swap units › swapping temperature units
      - swap units › swapping twice restores the original direction
      - swap units › swapping keeps the value and does not submit the page
