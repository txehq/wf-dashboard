hiddenTests:
  dir: hidden-tests
  config: hidden-tests/playwright.config.mts
  command: PLAYWRIGHT_JUNIT_OUTPUT_FILE={junitPath} npx playwright test --config {configPath} --reporter=junit
  timeoutSeconds: 600
  manifest:
    test/hidden/convert.hidden.spec.ts:
      - convert temperature › °C to °F
      - convert temperature › °F to °C
      - convert temperature › °C to K and back
      - convert temperature › °F to K and K to °F
      - convert temperature › same temperature unit returns the value
      - convert temperature › round trip °C → °F → °C
      - convert keeps existing behaviour › length and weight ratios
      - convert keeps existing behaviour › temperature cannot be converted to length
      - formatNumber › floating point noise is removed
      - formatNumber › at most four decimals
      - formatNumber › no trailing zeros
      - formatNumber › values that round to zero print as 0, never -0
      - formatNumber › negative values keep their sign
    test/hidden/ui.hidden.spec.ts:
      - existing conversions › one metre is 100 cm on load
      - existing conversions › switching to weight lists weight units
      - existing conversions › surrounding spaces in the value are ignored
      - result precision › 1 in shows 2.54 cm
      - result precision › 3 ft shows 0.9144 m
      - result precision › 1 oz is rounded to four decimals
      - result precision › 1 mi keeps all three decimals
      - temperature › the category lists Celsius, Fahrenheit and Kelvin
      - temperature › 100 °C is 212 °F
      - temperature › 37 °C is 98.6 °F
      - temperature › -40 °C is -40 °F
      - temperature › 0 K is -273.15 °C
      - temperature › 1 °F is -17.2222 °C
      - temperature › 0 °C is 273.15 K
      - temperature › negative temperatures above absolute zero are allowed
      - temperature › -459.67 °F is exactly absolute zero and allowed
      - invalid input › empty value shows a dash without an error
      - invalid input › "abc" asks for a number
      - invalid input › "12abc" asks for a number
      - invalid input › "1.2.3" asks for a number
      - invalid input › "-" asks for a number
      - invalid input › fixing the value clears the error
      - invalid input › negative length is rejected
      - invalid input › negative weight is rejected
      - invalid input › -300 °C is below absolute zero
      - invalid input › -1 K is below absolute zero
      - invalid input › -460 °F is below absolute zero
      - invalid input › changing the source unit re-checks absolute zero
      - swap units › swapping metre and centimetre
      - swap units › swapping temperature units
      - swap units › swapping twice restores the original direction
      - swap units › swapping keeps the value and does not submit the page
