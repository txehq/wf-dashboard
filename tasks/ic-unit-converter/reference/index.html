<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit converter</title>
  </head>
  <body>
    <main>
      <h1>Unit converter</h1>
      <form id="converter" autocomplete="off">
        <div class="field">
          <label for="category">Category</label>
          <select id="category"></select>
        </div>
        <div class="field">
          <label for="value">Value</label>
          <input
            id="value"
            type="text"
            inputmode="decimal"
            value="1"
            aria-describedby="value-error"
          />
          <p id="value-error" class="error" role="alert" hidden></p>
        </div>
        <div class="units">
          <div class="field">
            <label for="from">From</label>
            <select id="from"></select>
          </div>
          <button id="swap" type="button" class="swap" aria-label="Swap units" title="Swap units">
            ⇄
          </button>
          <div class="field">
            <label for="to">To</label>
            <select id="to"></select>
          </div>
        </div>
      </form>
      <p class="result">
        <label for="result">Result</label>
        <output id="result" for="value from to" aria-live="polite"></output>
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
