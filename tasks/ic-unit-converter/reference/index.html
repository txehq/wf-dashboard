<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>单位换算</title>
  </head>
  <body>
    <main>
      <h1>单位换算</h1>
      <form id="converter" autocomplete="off">
        <div class="field">
          <label for="category">类别</label>
          <select id="category"></select>
        </div>
        <div class="field">
          <label for="value">数值</label>
          <input
            id="value"
            type="text"
            inputmode="decimal"
            value="1"
            aria-describedby="value-error"
          />
          <p id="value-error" class="error" role="alert" hidden></p>
        </div>
        <div class="units">
          <div class="field">
            <label for="from">从</label>
            <select id="from"></select>
          </div>
          <button id="swap" type="button" class="swap" aria-label="交换单位" title="交换单位">
            ⇄
          </button>
          <div class="field">
            <label for="to">换算为</label>
            <select id="to"></select>
          </div>
        </div>
      </form>
      <p class="result">
        <label for="result">结果</label>
        <output id="result" for="value from to" aria-live="polite"></output>
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
