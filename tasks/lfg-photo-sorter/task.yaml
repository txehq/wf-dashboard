id: lfg-photo-sorter
kind: lfg
title: A command-line tool that organises photos by capture date
persona: |
  Liu Fang, a freelance photographer and also the family's "computer person"; she uses a MacBook Pro (Apple Silicon) and can type commands in a terminal but does not write code.
  Her drives hold more than ten years of photos, about 80,000 files and 1.2 TB, from cameras, phones and WeChat, scattered across folders on external drives.
  Cares about: never losing a photo and never overwriting an original ("I'd rather not organise them at all than lose a single one"); after organising she can find photos by date in Finder and Lightroom; before anything runs she wants to see what it is going to move.
  How she talks: impatient, talks about concrete pain points and examples (photos exported from WeChat are named with a string of digits); on technical details she says "you figure it out", but on anything touching photo safety she keeps asking until she gets a clear answer.
hiddenRequirements: |
  Platform and installation
  - Used mainly on macOS 14 (Apple Silicon); her assistant uses Windows 11 and must be able to use it too; Linux support is not needed.
  - Installed with one command or by downloading a single executable; she does not want to install a runtime such as Python.
  Input
  - One or more source directories, processed recursively, possibly on external drives.
  - File types: JPEG, HEIC, PNG, RAW (CR3, NEF, ARW, DNG) and MOV and MP4 videos; videos are organised by capture date too.
  Capture date
  - Source priority: EXIF DateTimeOriginal → creation_time in the video metadata → a date in the file name (WeChat's mmexport1634567890123.jpg is a millisecond timestamp; IMG_20210314_101500.jpg, Screenshot_2021-03-14-10-15-00.png and so on) → the file modification time.
  - Time zones follow the offset stored in the photo; without an offset, the local machine's time zone is used.
  - The report states which source each file's date came from.
  Target layout
  - <target directory>/YYYY/YYYY-MM/YYYY-MM-DD_<original file name>.
  - A RAW file and the JPEG with the same name go into the same directory.
  - Files with no determinable date go into <target directory>/Unknown date/.
  Safety
  - Copies by default and does not move; only with --move does it move, and it deletes a source file only after the copy has finished and its SHA-256 matches.
  - Never overwrites an existing file under any circumstances; a file with the same name but different content gets a _1, _2 suffix.
  - Exact duplicates (same hash) are not copied again and are listed in the report.
  - --dry-run only prints the plan and changes no files; a real run writes a CSV report (source path, target path, date source, action).
  - It can be interrupted with Ctrl+C; running it again continues where it stopped without copying anything twice.
  Performance
  - 80,000 files and 1.2 TB on a USB 3 external drive finish within one night (8 hours); progress and estimated time remaining are shown.
  Out of scope
  - A graphical interface; face recognition; organising by location; editing or compressing photos; syncing with cloud drives such as iCloud or Google Photos; finding similar but not identical photos; modifying photos' EXIF.
  Authority
  - The agent may choose the language and libraries, create a new repository and commit code, and write tests; it must never run on her real photo directories, tests use only sample files; it must ask her before publishing to Homebrew.
  Acceptance
  - She will prepare a sample directory of 500 files (with exact duplicates, files without EXIF, WeChat exports, RAW+JPEG pairs and videos): the dry-run plan matches the result of the real run; the number of source files equals the number of target files plus duplicates; no file is lost or overwritten.
input: build a command-line tool that sorts the messy photos on my computer by the date they were taken
