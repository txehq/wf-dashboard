id: lfg-photo-sorter
workflow: dev-workflow
bigStage: lfg
title: 按拍摄日期整理照片的命令行工具
persona: |
  刘芳，自由摄影师，也是家里的"电脑负责人"；用 MacBook Pro（Apple Silicon），会用终端敲命令但不写代码。
  硬盘里有十几年的照片，约 8 万张、1.2 TB，来自相机、手机和微信，散落在外接硬盘的各个文件夹里。
  关心：绝对不能丢照片、不能覆盖原图（"我宁可不整理，也不能丢一张"）；整理后在 Finder 和 Lightroom 里能按日期找到；执行之前想先看看会怎么动。
  说话方式：性子急，讲具体的痛点和例子（微信导出的照片名字是一串数字）；技术细节会说"你们看着办"，但涉及照片安全的问题会追问到底。
hiddenRequirements: |
  平台与安装
  - 主要在 macOS 14（Apple Silicon）上用；她的助理用 Windows 11，也要能用；不需要支持 Linux。
  - 一条命令安装或下载单个可执行文件即可使用，不想安装 Python 之类的运行环境。
  输入
  - 一个或多个源目录，递归处理，可以在外接硬盘上。
  - 文件类型：JPEG、HEIC、PNG、RAW（CR3、NEF、ARW、DNG）、视频 MOV 与 MP4；视频也按拍摄日期整理。
  拍摄日期
  - 来源优先级：EXIF DateTimeOriginal → 视频元数据的 creation_time → 文件名中的日期（微信 mmexport1634567890123.jpg 是毫秒时间戳；IMG_20210314_101500.jpg、Screenshot_2021-03-14-10-15-00.png 等）→ 文件修改时间。
  - 时区按照片自带的偏移，没有偏移时按本机时区。
  - 报告中写明每个文件的日期来自哪种来源。
  目标结构
  - <目标目录>/YYYY/YYYY-MM/YYYY-MM-DD_原文件名。
  - RAW 与同名的 JPEG 放在同一个目录。
  - 无法确定任何日期的文件放进 <目标目录>/未知日期/。
  安全
  - 默认复制，不移动；加 --move 才移动，并且只在复制完成、SHA-256 校验一致之后才删除源文件。
  - 任何情况下都不覆盖已存在的文件；同名但内容不同时加 _1、_2 后缀。
  - 内容完全相同（哈希一致）的重复文件不再复制，在报告中列出。
  - --dry-run 只打印计划，不改动任何文件；正式执行后生成 CSV 报告（源路径、目标路径、日期来源、动作）。
  - 可以按 Ctrl+C 中断；再次运行时从中断处继续，不重复复制。
  性能
  - 8 万张、1.2 TB 在 USB 3 外接硬盘上一个晚上（8 小时）内完成；显示进度与预计剩余时间。
  不做
  - 图形界面；人脸识别；按地点整理；编辑或压缩照片；iCloud、Google Photos 等云盘同步；找出相似但不完全相同的照片；修改照片的 EXIF。
  授权
  - agent 可以自己选择语言与库、新建仓库提交代码、写测试；绝不能在她的真实照片目录上运行，测试只用样本文件；发布到 Homebrew 之前要先问她。
  验收
  - 她会准备一个 500 个文件的样本目录（含完全重复的文件、没有 EXIF 的文件、微信导出、RAW+JPEG 配对、视频）：dry-run 的计划与实际执行结果一致；源文件数等于目标文件数加重复数；没有任何文件丢失或被覆盖。
input: 做一个命令行工具，把我电脑里乱七八糟的照片按拍摄日期整理好
