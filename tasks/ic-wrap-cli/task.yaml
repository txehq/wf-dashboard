id: ic-wrap-cli
kind: ic
title: "wrap command-line tool: paragraphs, long words and argument validation"
persona: |-
  Lin Xiao, an engineer on Acme's documentation team, uses wrap to lay out release notes at a fixed width before pasting them into emails and terminal messages.
  Cares about: long URLs break the layout and several paragraphs get squashed into one; when wrap fails inside a script she wants a clear exit code, not silently blank output.
  How she talks: in English, casual, likes to give a concrete piece of text to show what she expects; particular about command-line conventions (exit codes, stderr, trailing newline).
hiddenRequirements: |-
  wrap(text, width = 80):
  - Paragraphs are separated by blank lines (lines with only spaces and tabs count as blank, and several consecutive blank lines count as one); in the output there is exactly one blank line between paragraphs.
  - Spaces, tabs and single newlines inside a paragraph collapse into one space; no line has leading or trailing whitespace; leading and trailing blank lines are removed.
  - Greedy line breaking, no line exceeds width; there must be no blank line before the first word.
  - A word longer than width starts on a new line and is cut into chunks of width characters; the last chunk becomes the new current line, and following words may join it.
  - Width is counted in Unicode code points (an emoji or an accented letter counts as one).
  - CRLF line endings are supported.
  - An empty or whitespace-only input returns an empty string.
  - A RangeError is thrown when width is not a positive integer.
  Command line bin/wrap.js:
  - Usage wrap [--width N | -w N | --width=N] [file], default width 80; without file it reads stdin.
  - The output is the result of wrap plus a trailing newline; when the result is empty nothing is printed; exit code 0.
  - When width is not a positive integer (0, negative, fractional, letters, empty string), stderr prints `wrap: invalid width: <original value>`, the exit code is 2 and stdout is empty.
  - When the file does not exist or cannot be read, stderr starts with `wrap: cannot read <path>` and the exit code is 1.
  - For an unknown option stderr starts with `wrap: ` and the exit code is 2.
  - No new dependencies; argument parsing keeps using parseArgs from node:util; add tests for the library and the command line.
ticket:
  title: wrap overflows on long words, merges paragraphs and does not validate command-line arguments
  body: |-
    `wrap` currently only splits on spaces, which causes three kinds of problems:

    1. Words longer than the width (URLs, for example) are printed as they are and lines exceed the width; when the first word is too long, the output starts with a blank line.
    2. Newlines and blank lines in the input are treated as part of words, the paragraph structure is lost, and extra spaces are kept.
    3. The command line does not validate `--width`: `wrap --width abc` reports no error and the output has no trailing newline; a missing file prints a Node stack trace.

    Please fix `src/wrap.js` and `bin/wrap.js` so wrap can be used safely in scripts.
  acceptanceCriteria:
    - No output line exceeds the configured width; a word longer than the width starts on a new line and is split by the width; width is counted in Unicode code points.
    - Paragraphs separated by blank lines stay separated in the output with exactly one blank line between them; newlines and runs of whitespace inside a paragraph collapse into one space, and lines have no leading or trailing whitespace.
    - "`wrap()` throws a `RangeError` when width is not a positive integer; empty or whitespace-only input returns an empty string."
    - The command line reads from a file or stdin and ends its output with one newline; `--width`, `-w` and `--width=N` all work, default 80.
    - "With an invalid `--width`, stderr prints `wrap: invalid width: <value>` and the exit code is 2; for an unreadable file stderr starts with `wrap: cannot read <path>` and the exit code is 1; an unknown option exits with code 2."
    - New tests cover the behaviour above and `npm test` passes.
repo:
  path: repo.bundle
  commit: e54d68d23fa64b1c1664f6f05cf59a809640a293
requiredChecks:
  - ci
hiddenTests:
  dir: hidden-tests
  config: vitest.hidden.config.mjs
  command: npx vitest run test/hidden --config {configPath} --reporter=junit --outputFile.junit={junitPath}
  timeoutSeconds: 600
  manifest:
    test/hidden/cli.hidden.test.js:
      - input and output > reads stdin and ends the output with one newline
      - input and output > short option -w
      - input and output > --width=N form
      - input and output > reads a file given as an argument
      - input and output > default width is 80
      - input and output > empty input prints nothing
      - errors > invalid width "0" exits 2
      - errors > invalid width "-5" exits 2
      - errors > invalid width "abc" exits 2
      - errors > invalid width "1.5" exits 2
      - errors > invalid width "" exits 2
      - errors > missing file exits 1 and names the file
      - errors > unknown option exits 2
    test/hidden/wrap.hidden.test.js:
      - line breaking > greedy fill between words
      - line breaking > a word that exactly fills the width
      - line breaking > the first word is not preceded by an empty line
      - line breaking > no line exceeds the width
      - line breaking > default width is 80
      - whitespace > runs of spaces and tabs collapse to one space
      - whitespace > single newlines inside a paragraph are re-flowed
      - whitespace > leading and trailing whitespace is removed
      - whitespace > no line has trailing spaces
      - whitespace > empty and whitespace-only input give an empty string
      - paragraphs > blank lines separate paragraphs
      - paragraphs > several blank lines collapse to one
      - paragraphs > lines with only spaces count as blank
      - paragraphs > each paragraph is wrapped on its own
      - paragraphs > CRLF line endings
      - long words > a word longer than the width is split into full-width chunks
      - long words > a long word starts on a new line
      - long words > words after a long word can join its last chunk
      - long words > width 1 puts every character on its own line
      - unicode > width counts code points, not UTF-16 units
      - unicode > accented words are not split early
      - invalid width > width 0 throws RangeError
      - invalid width > width -3 throws RangeError
      - invalid width > width 2.5 throws RangeError
      - invalid width > width NaN throws RangeError
