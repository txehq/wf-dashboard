id: ic-money-format
kind: ic
title: "Money formatting: per-currency decimals, negative and large amounts"
persona: |-
  He Jing, maintainer of the internal @acme/money library, a backend engineer who also owns the company's billing service.
  Cares about: invoices in Japanese yen, Korean won and Kuwaiti dinar show wrong amounts in customer emails and finance has already complained; the fix must not change the existing output for US dollars, euros and the like.
  How she talks: short and direct, in English, usually gives concrete inputs and expected outputs; on anything she is unsure of she says "follow the ticket".
hiddenRequirements: |-
  - Decimals always come from the currency's decimals in src/currencies.js: JPY and KRW show no decimal point; KWD shows three decimals; currencies added to the table later also use their own decimals, so no hard-coded list of currencies.
  - Negative amounts: the minus sign goes before the currency symbol, for example -1999 USD shows as -$19.99; -0 shows as 0 without a minus sign.
  - Amounts within Number.MAX_SAFE_INTEGER must be exact and must not go through floating point division (900719925474099 USD must show as $9,007,199,254,740.99).
  - Unsupported currencies (including keys inherited from objects such as toString) throw a RangeError whose message contains the currency code.
  - When amountMinor is not a safe integer (a fraction, a string, NaN, above MAX_SAFE_INTEGER) a TypeError is thrown.
  - Thousands separators are always commas and the decimal point is always a dot, with no localisation; there is no space between the currency symbol and the number; the function signature formatMoney(amountMinor, currency) stays the same.
  - No new dependencies and no change to the version in package.json; add unit tests for the fix.
ticket:
  title: formatMoney shows zero- and three-decimal currencies wrongly, and negative amounts in the wrong format
  body: |-
    `formatMoney` treats every currency as having two decimals: `formatMoney(1234, 'JPY')` shows `¥12.34` but should be `¥1,234`; `formatMoney(1234567, 'KWD')` shows `KD12,345.67` but should be `KD1,234.567`. Every yen, won and Kuwaiti dinar amount in customer emails is wrong.

    Also, negative amounts show as `$-19.99` while finance requires `-$19.99`; an unsupported currency throws `Cannot destructure property 'symbol'`, which does not say which currency it was.

    Please fix `src/format.js`; the currency decimals are defined by `src/currencies.js`.
  acceptanceCriteria:
    - "Decimals come from the currency's `decimals` in `src/currencies.js`: `formatMoney(1234, 'JPY')` is `¥1,234`, `formatMoney(1234567, 'KWD')` is `KD1,234.567`, `formatMoney(5, 'KWD')` is `KD0.005`; existing output for two-decimal currencies is unchanged."
    - "The minus sign of a negative amount goes before the currency symbol: `formatMoney(-1999, 'USD')` is `-$19.99`."
    - "Amounts within `Number.MAX_SAFE_INTEGER` are shown exactly: `formatMoney(900719925474099, 'USD')` is `$9,007,199,254,740.99`."
    - An unsupported currency throws a `RangeError` whose message contains the currency code; a `TypeError` is thrown when `amountMinor` is not a safe integer.
    - New unit tests cover the behaviour above and `npm test` passes.
repo:
  path: repo.bundle
  commit: cad4548c12c622f8f01e5761b74f013adab71ab3
requiredChecks:
  - ci
hiddenTests:
  dir: hidden-tests
  config: vitest.hidden.config.mjs
  command: npx vitest run test/hidden --config {configPath} --reporter=junit --outputFile.junit={junitPath}
  timeoutSeconds: 600
  manifest:
    test/hidden/format.hidden.test.js:
      - minor-unit digits come from the currency table > JPY has no fraction
      - minor-unit digits come from the currency table > KRW has no fraction and still groups thousands
      - minor-unit digits come from the currency table > KWD has three fraction digits
      - minor-unit digits come from the currency table > KWD pads small amounts to three digits
      - minor-unit digits come from the currency table > two-digit currencies are unchanged
      - minor-unit digits come from the currency table > zero in a zero-decimal currency
      - minor-unit digits come from the currency table > a currency added to the table is formatted with its own digits
      - negative amounts > minus sign goes before the symbol
      - negative amounts > negative amount below one major unit
      - negative amounts > negative zero-decimal amount with grouping
      - negative amounts > negative zero is formatted as zero
      - large amounts are exact > largest safe integer in a two-digit currency
      - large amounts are exact > amount that floating-point division rounds wrongly
      - large amounts are exact > largest safe integer in a three-digit currency
      - invalid input > unknown currency throws RangeError naming the code
      - invalid input > inherited object keys are not currencies
      - invalid input > fractional minor units throw TypeError
      - invalid input > non-numbers throw TypeError
      - invalid input > unsafe integers throw TypeError
